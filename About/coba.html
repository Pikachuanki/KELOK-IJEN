<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peta KRB (Tes Satu File)</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <style>
    html, body {
      height: 100%;
      margin: 0;
    }
    #map {
      width: 100%;
      height: 100%;
    }
    /* panel di kanan */
    #panel {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 220px;
      background: rgba(255,255,255,0.9);
      border-radius: 6px;
      padding: 8px;
      font-family: Arial, sans-serif;
      font-size: 13px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      z-index: 1000;
    }
    .layer-item {
      margin: 4px 0;
    }
    .color-box {
      display: inline-block;
      width: 16px;
      height: 12px;
      margin-right: 6px;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="panel">
    <b>KRB Layers</b><br>
    <div id="layers-list"></div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <script>
    // buat map
    var map = L.map('map').setView([-8.3, 115.1], 10);

    // basemap citra satelit
    L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', 
      {
        attribution: 'Tiles © Esri',
        maxZoom: 19
      }
    ).addTo(map);

    // daftar file geojson
    var files = ["krb1.geojson","krb2.geojson","krb3.geojson","krb4.geojson","krb5.geojson","krb6.geojson"];
    var labels = ["KRB 1","KRB 2","KRB 3","KRB 4","KRB 5","KRB 6"];
    var colors = ["#e41a1c","#377eb8","#4daf4a","#984ea3","#ff7f00","#ffff33"];

    var layers = [];

    files.forEach(function(f,i){
      fetch(f).then(r => r.json()).then(data => {
        var layer = L.geoJSON(data,{
          style:{color:colors[i],weight:2,fillOpacity:0.4,fillColor:colors[i]},
          onEachFeature:function(feat,lyr){
            if(feat.properties){
              lyr.bindPopup(Object.entries(feat.properties).map(e=>`<b>${e[0]}</b>: ${e[1]}`).join("<br>"));
            }
          }
        }).addTo(map);

        layers.push(layer);

        // panel checkbox
        var cb = document.createElement("input");
        cb.type="checkbox"; cb.checked=true;
        cb.onchange = function(){ 
          if(this.checked){ map.addLayer(layer); } else { map.removeLayer(layer); }
        };
        var lbl = document.createElement("label");
        lbl.innerHTML = `<span class="color-box" style="background:${colors[i]}"></span>${labels[i]}`;
        var div = document.createElement("div");
        div.className="layer-item";
        div.appendChild(cb);
        div.appendChild(lbl);
        document.getElementById("layers-list").appendChild(div);
      });
    });
  </script>
</body>
</html>
